# Generate the Xcode project with:  ./setup.sh   (or: xcodegen generate)
name: Jarvis
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    # Bundle IDs must be unique to you. setup.sh fills these in from the environment.
    BUNDLE_PREFIX: ${JARVIS_BUNDLE_PREFIX}
    DEVELOPMENT_TEAM: ${JARVIS_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  JarvisMac:
    type: application
    platform: macOS
    sources: [Shared, SharedUI, Mac]
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        LSApplicationCategoryType: public.app-category.productivity
        JarvisAppGroup: group.$(BUNDLE_PREFIX).jarvis
    entitlements:
      path: Mac/Jarvis.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_NAME: Jarvis
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).jarvis.mac
        ENABLE_HARDENED_RUNTIME: NO

  JarvisiOS:
    type: application
    platform: iOS
    sources: [Shared, SharedUI, iOS]
    dependencies:
      - target: JarvisBroadcast   # embedded in the app automatically
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        JarvisAppGroup: group.$(BUNDLE_PREFIX).jarvis
    entitlements:
      path: iOS/Jarvis.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).jarvis]
    settings:
      base:
        PRODUCT_NAME: Jarvis
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).jarvis
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad

  JarvisBroadcast:
    type: app-extension
    platform: iOS
    sources: [Shared, Broadcast]
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        JarvisAppGroup: group.$(BUNDLE_PREFIX).jarvis
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Broadcast/JarvisBroadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).jarvis]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).jarvis.Broadcast
